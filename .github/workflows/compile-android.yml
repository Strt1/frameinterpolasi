name: Android NDK Compiler (Fixed Path)
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install NDK
        run: |
          mkdir -p $HOME/android-ndk
          wget -O ndk.zip https://dl-cdn.google.com/android_sdk/ndk/25.1.8937393-linux-x86_64.zip
          unzip ndk.zip -d $HOME/android-ndk
          # Fix folder nesting that often happens with NDK zips
          mv $HOME/android-ndk/android-ndk-r25c $HOME/android-ndk/ndk || true

      - name: Compile
        run: |
          # Find the actual clang++ binary path
          CLANG_PATH=$(find $HOME/android-ndk -name aarch64-linux-android-clang++ | head -n 1)
          echo "Using compiler: $CLANG_PATH"
          $CLANG_PATH -shared -fPIC -o libinterpolation.so frame.cpp -static-stdlib

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: android-binary
          path: libinterpolation.so
