name: Android NDK Compiler (Manual Setup)
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install NDK Manually
        run: |
          mkdir -p $HOME/android-ndk
          wget -O ndk.zip https://dl-cdn.google.com/android_sdk/ndk/25.1.8937393-linux-x86_64.zip
          unzip ndk.zip -d $HOME/android-ndk
          echo "NDK_HOME=$HOME/android-ndk" >> $GITHUB_ENV

      - name: Compile C++ to Shared Library
        run: |
          $HOME/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android-clang++ \
          -shared -fPIC -o libinterpolation.so frame.cpp \
          -static-stdlib

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-binary
          path: libinterpolation.so
